project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "guia/**"
    # Tópicos 01 em diante. A pasta 00-modelo é só o modelo para copiar e não
    # é publicada no site.
    - "content/0[1-9]-*/**"
    - "content/[1-9][0-9]-*/**"

website:
  title: "Guia Aberto de Arquitetura de Software"
  favicon: ""
  site-url: "https://ifpe-belojardim-es.github.io/guia-arquitetura-de-software"
  repo-url: "https://github.com/IFPE-BeloJardim-ES/guia-arquitetura-de-software"
  repo-branch: main
  repo-actions: [edit, issue]
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Início
      - text: Guia
        menu:
          - href: guia/contribuindo.qmd
            text: Como contribuir
          - href: guia/sobre.qmd
            text: Sobre o projeto
      - text: Tópicos
        menu:
          - href: content/01-pipe-and-filter/index.qmd
            text: "01 — Pipe and Filter"
          - href: content/02-arquitetura-em-camadas/index.qmd
            text: "02 — Arquitetura em Camadas"
          - href: content/03-mvc/index.qmd
            text: "03 — MVC"
          - href: content/04-cliente-servidor/index.qmd
            text: "04 — Arquitetura Cliente-Servidor"
          - href: content/05-microsservicos/index.qmd
            text: "05 — Microsserviços"
    right:
      - icon: github
        href: "https://github.com/IFPE-BeloJardim-ES/guia-arquitetura-de-software"
        aria-label: "Repositório no GitHub"
  page-footer:
    center: |
      Conteúdo sob [CC BY-NC 4.0](LICENSE).

format:
  html:
    theme: cosmo
    lang: pt-BR
    toc: true
    toc-title: "Nesta página"
    code-copy: true
    code-overflow: wrap
