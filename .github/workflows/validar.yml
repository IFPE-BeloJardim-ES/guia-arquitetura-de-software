name: Validar conteúdo

on:
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar tópicos
        run: python scripts/validar_conteudo.py

      - name: Conferir lista de contribuidores
        run: python scripts/gerar_contribuidores.py --verificar

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar site
        run: quarto render
