name: Publicar no GitHub Pages

# Publica o site a cada merge na main. Também pode ser disparado à mão pela
# aba Actions.
#
# Pré-requisito, uma vez por repositório:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o deploy oficial de Pages (sem branch gh-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Renderizar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar site
        run: quarto render

      - uses: actions/configure-pages@v5

      - name: Empacotar _site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
