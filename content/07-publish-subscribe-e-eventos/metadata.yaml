numero: "07"
slug: "publish-subscribe-e-eventos"
titulo: "Publish-Subscribe e Arquitetura Baseada em Eventos"
subtitulo: "Componentes que reagem a fatos sem precisar saber quem os anunciou"
resumo: >-
  Publish-subscribe é a forma de comunicação em que um componente publica um
  evento e quem assinou aquele tipo de evento é avisado, sem que o publicador
  saiba quem são os assinantes. A arquitetura baseada em eventos organiza o
  sistema inteiro em torno desse mecanismo. O tópico mostra, com uma loja virtual
  executável, o que se ganha em extensibilidade, tempo de resposta e isolamento
  de falhas, e o que se paga em consistência eventual, entregas duplicadas,
  ordem trocada e rastreabilidade.

