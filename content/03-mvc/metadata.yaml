# Metadados do tópico — MVC (Model-View-Controller)
numero: "03"
slug: "03-mvc"
titulo: "MVC (Model-View-Controller)"
subtitulo: "Separação de responsabilidades entre domínio, apresentação e controle"
resumo: >-
  O padrão arquitetural Model-View-Controller (MVC) divide sistemas interativos
  em três partes com responsabilidades estritas: Model (estado e lógica de negócio),
  View (exibição para o usuário) e Controller (tradução de entradas e comandos).
  Nascido no Xerox PARC com Smalltalk-80 e amplamente difundido na web moderna,
  o MVC isola o que o sistema faz da forma como ele se apresenta, viabilizando
  testes automatizados e múltiplas interfaces simultâneas.

