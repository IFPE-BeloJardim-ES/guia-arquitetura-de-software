numero: "06"
slug: "transacoes-em-arquiteturas-distribuidas"
titulo: "Transações Distribuídas: 2PC e Saga"
subtitulo: "A dança caótica do \"ou tudo, ou nada\""
resumo: >-
  Em arquiteturas de microsserviços, cada serviço possui seu próprio banco de
  dados, exigindo mecanismos de coordenação para manter a consistência entre
  operações distribuídas. Este tópico analisa as duas principais abordagens —
  Two-Phase Commit (2PC) e o padrão Saga —, comparando sua estrutura,
  comportamento sob contenção, trade-offs e critérios de decisão.

