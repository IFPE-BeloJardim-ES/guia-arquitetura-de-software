numero: "05"
slug: "microsservicos"
titulo: "Arquitetura de microsserviços"
subtitulo: "Estrutura, componentes e comunicação entre serviços"
resumo: >-
  Apresenta os conceitos fundamentais da arquitetura de microsserviços,
  sua organização por capacidades de negócio, autonomia dos serviços,
  comunicação por REST e mensageria, além do uso de API Gateway e
  Service Discovery. Também aborda consistência de dados, padrão Saga,
  consistência eventual, vantagens, desafios e principais trade-offs.

