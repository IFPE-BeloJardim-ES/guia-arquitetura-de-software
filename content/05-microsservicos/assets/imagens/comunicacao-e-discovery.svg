<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de comunicação síncrona e descoberta de serviços</title><desc id="desc">Uma requisição passa pelo gateway, consulta o registry e chega à instância saudável; um evento segue de um produtor para o broker e consumidores.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#425466"/></marker><style>.b{stroke:#17324d;stroke-width:2;rx:12}.t{font:600 17px Arial;fill:#17324d}.s{font:14px Arial;fill:#425466}.flow{font:12px Arial;fill:#425466}.l{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#a)}.e{stroke:#c05621;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
<rect width="1200" height="520" fill="#f7fafc"/><text x="600" y="42" text-anchor="middle" class="t" style="font-size:25px">Do nome lógico à instância: duas formas de colaborar</text>
<text x="36" y="92" class="t">1 · chamada síncrona (consulta / comando)</text><rect x="35" y="120" width="150" height="70" class="b" fill="#e6fffa"/><text x="110" y="162" text-anchor="middle" class="t">Cliente</text><rect x="250" y="120" width="180" height="70" class="b" fill="#bee3f8"/><text x="340" y="162" text-anchor="middle" class="t">API Gateway</text><rect x="495" y="95" width="190" height="120" class="b" fill="#edf2f7"/><text x="590" y="135" text-anchor="middle" class="t">Service Registry</text><text x="590" y="164" text-anchor="middle" class="s">nome → instâncias</text><text x="590" y="185" text-anchor="middle" class="s">health checks</text><rect x="760" y="120" width="170" height="70" class="b" fill="#fefcbf"/><text x="845" y="162" text-anchor="middle" class="t">Pedidos v2</text><rect x="1000" y="120" width="150" height="70" class="b" fill="#fefcbf"/><text x="1075" y="162" text-anchor="middle" class="t">Resposta</text>
<path d="M185 155 H250" class="l"/><path d="M430 155 H495" class="l"/><path d="M685 155 H760" class="l"/><path d="M930 155 H1000" class="l"/><text x="462" y="145" text-anchor="middle" class="flow">descobrir</text><text x="722" y="145" text-anchor="middle" class="flow">rotear</text>
<text x="36" y="280" class="t">2 · evento assíncrono (notificação / integração)</text><rect x="110" y="320" width="190" height="80" class="b" fill="#fefcbf"/><text x="205" y="354" text-anchor="middle" class="t">Pedidos</text><text x="205" y="378" text-anchor="middle" class="s">publica PedidoCriado</text><rect x="475" y="305" width="245" height="110" class="b" fill="#fed7d7"/><text x="597" y="348" text-anchor="middle" class="t">Broker / tópico</text><text x="597" y="374" text-anchor="middle" class="s">durabilidade · retry</text><text x="597" y="395" text-anchor="middle" class="s">entrega desacoplada</text><rect x="875" y="300" width="190" height="70" class="b" fill="#e6fffa"/><text x="970" y="342" text-anchor="middle" class="t">Pagamento</text><rect x="875" y="390" width="190" height="70" class="b" fill="#e6fffa"/><text x="970" y="432" text-anchor="middle" class="t">Notificações</text>
<path d="M300 360 H475" class="e"/><path d="M720 345 H875" class="e"/><path d="M720 390 H875" class="e"/><text x="376" y="350" text-anchor="middle" class="flow">publicar</text><text x="797" y="335" text-anchor="middle" class="flow">assinar</text>
</svg>
