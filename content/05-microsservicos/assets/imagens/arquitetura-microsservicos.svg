<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura de referência de microsserviços</title>
<desc id="desc">Clientes acessam um API Gateway, que encaminha chamadas para microsserviços. Os serviços possuem dados próprios e publicam eventos em um broker.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#425466"/></marker><style>.box{stroke:#17324d;stroke-width:2;rx:14}.label{font:600 18px Arial,sans-serif;fill:#17324d}.small{font:14px Arial,sans-serif;fill:#425466}.flow{font:12px Arial,sans-serif;fill:#425466}.rest{font:10px Arial,sans-serif;fill:#425466}.title{font:700 26px Arial,sans-serif;fill:#102a43}.line{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#arrow)}.event{stroke:#c05621;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="660" fill="#f7fafc"/><text x="600" y="44" text-anchor="middle" class="title">Microsserviços: fronteiras, entrada e colaboração</text>
<rect x="45" y="255" width="155" height="110" class="box" fill="#e6fffa"/><text x="122" y="296" text-anchor="middle" class="label">Clientes</text><text x="122" y="322" text-anchor="middle" class="small">Web · mobile</text><text x="122" y="344" text-anchor="middle" class="small">sistemas externos</text>
<rect x="255" y="230" width="190" height="160" class="box" fill="#bee3f8"/><text x="350" y="274" text-anchor="middle" class="label">API Gateway</text><text x="350" y="302" text-anchor="middle" class="small">TLS · autenticação</text><text x="350" y="324" text-anchor="middle" class="small">roteamento · limite</text><text x="350" y="346" text-anchor="middle" class="small">composição / BFF</text>
<rect x="500" y="120" width="600" height="370" rx="20" fill="#fff" stroke="#90a4ae" stroke-width="2"/><text x="800" y="151" text-anchor="middle" class="label">Domínio da aplicação</text>
<rect x="530" y="190" width="155" height="115" class="box" fill="#fefcbf"/><text x="607" y="228" text-anchor="middle" class="label">Catálogo</text><text x="607" y="253" text-anchor="middle" class="small">API REST</text><text x="607" y="274" text-anchor="middle" class="small">dados próprios</text>
<rect x="722" y="190" width="155" height="115" class="box" fill="#fefcbf"/><text x="799" y="228" text-anchor="middle" class="label">Pedidos</text><text x="799" y="253" text-anchor="middle" class="small">API REST</text><text x="799" y="274" text-anchor="middle" class="small">dados próprios</text>
<rect x="914" y="190" width="155" height="115" class="box" fill="#fefcbf"/><text x="991" y="228" text-anchor="middle" class="label">Pagamento</text><text x="991" y="253" text-anchor="middle" class="small">API REST</text><text x="991" y="274" text-anchor="middle" class="small">dados próprios</text>
<rect x="590" y="360" width="390" height="90" class="box" fill="#fed7d7"/><text x="785" y="397" text-anchor="middle" class="label">Broker / Event Bus</text><text x="785" y="423" text-anchor="middle" class="small">tópicos · filas · eventos</text>
<rect x="45" y="535" width="1055" height="70" rx="14" fill="#edf2f7" stroke="#90a4ae" stroke-width="2"/><text x="572" y="565" text-anchor="middle" class="label">Service Discovery / Registry</text><text x="572" y="588" text-anchor="middle" class="small">nome lógico → instâncias saudáveis (host, porta, versão)</text>
<path d="M200 310 H255" class="line"/><path d="M445 280 H530" class="line"/><path d="M445 340 H722" class="line"/><path d="M607 305 V360" class="event"/><path d="M799 305 V360" class="event"/><path d="M991 305 V360" class="event"/><path d="M350 390 V535" class="line"/><path d="M607 450 V535" class="line"/><path d="M799 450 V535" class="line"/><path d="M991 450 V535" class="line"/>
<text x="228" y="301" text-anchor="middle" class="flow">HTTPS</text><text x="485" y="273" text-anchor="middle" class="rest">HTTP/REST</text><text x="835" y="338" text-anchor="middle" class="flow">evento</text>
</svg>
