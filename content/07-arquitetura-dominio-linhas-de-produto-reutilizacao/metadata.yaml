resumo: >-
  Explora como Arquiteturas de Domínio e Linhas de Produtos de Software (LPS)
  organizam o reuso sistemático de ativos entre famílias de sistemas. Aborda
  Engenharia de Domínio e de Aplicação, modelos de features, especificação
  anotativa e composicional, técnicas de implementação de variabilidade e os
  trade-offs frente ao clone-and-own.

